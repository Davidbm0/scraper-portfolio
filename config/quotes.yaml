# quotes.toscrape.com -- paginated quotes with tags (sandbox site made for scraping practice)
name: quotes_toscrape
start_urls:
  - https://quotes.toscrape.com/
item_selector: "div.quote"
pagination_next: "li.next > a"
delay_s: 1.0
max_pages: 5
fields:
  quote:
    selector: "span.text"
  author:
    selector: "small.author"
  tags:
    selector: "div.tags a.tag"
    extract: "multi"
