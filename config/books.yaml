# books.toscrape.com -- paginated product listings (sandbox site made for scraping practice)
name: books_toscrape
start_urls:
  - https://books.toscrape.com/
item_selector: "article.product_pod"
pagination_next: "li.next > a"
delay_s: 1.0
max_pages: 5
fields:
  title:
    selector: "h3 a"
    extract: "attr:title"
  price:
    selector: "p.price_color"
    extract: "price"
  rating:
    selector: "p.star-rating"
    extract: "rating"
  stock:
    selector: "p.instock"
